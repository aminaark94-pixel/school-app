    <!--
      App palette (default look). The whole UI reads these CSS variables.
      - theme.config.json overrides them at build time (the "published" look for a school).
      - Owner Studio (#owner) overrides them live in the owner's own browser.
    -->
    <style id="theme-defaults">:root{--t-primary:#8b0000;--t-accent:#d4af37;--t-ink:#200e01;--t-bg:#faf8f2;--t-sand:#ede7c7;--t-font-sans:"Plus Jakarta Sans", sans-serif;--t-font-display:"Cinzel", serif;--t-radius-card:1.5rem;--t-radius-pill:9999px;--t-primary-dark:color-mix(in srgb, var(--t-primary) 82%, #000);--t-primary-deep:color-mix(in srgb, var(--t-primary) 65%, #000);--t-primary-tint:color-mix(in srgb, var(--t-primary) 7%, #fff);--t-primary-tint2:color-mix(in srgb, var(--t-primary) 13%, #fff);--t-accent-tint:color-mix(in srgb, var(--t-accent) 8.5%, #fff);--t-accent-tint2:color-mix(in srgb, var(--t-accent) 19%, #fff);--t-ink-lift:color-mix(in srgb, var(--t-ink) 92%, var(--t-primary));--t-ink-lift2:color-mix(in srgb, var(--t-ink) 82%, var(--t-primary))}</style>
    <script>
      // Apply the owner's saved preview colours before the first paint (no flash).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('owner_theme_v1') || 'null');
          if (saved && saved.colors) {
            var root = document.documentElement;
            for (var k in saved.colors) {
              if (/^#[0-9a-fA-F]{6}$/.test(saved.colors[k])) {
                root.style.setProperty('--t-' + k, saved.colors[k]);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
